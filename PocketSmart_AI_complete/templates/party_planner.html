{% extends 'base.html' %}{% block title %}Party Budget Planner | PocketSmart{% endblock %}{% block content %}<section class="planner-hero"><h1>Party Budget Planner</h1><p>Plan your event with AI-powered budget recommendations.</p></section><section class="form-card"><form id="partyForm"><div class="form-section"><h3>💰 Basic Information</h3><div class="grid2"><label>Total Budget (₹)<input name="total_budget" type="number" min="1" required></label><label>Number of Guests<input name="guests" type="number" min="1" required></label></div></div><div class="form-section"><h3>🎉 Event Details</h3><div class="grid2"><label>Party Type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Anniversary</option><option>Family Gathering</option></select></label><label>Venue Type<input name="venue_type" value="Home"></label></div></div><div class="form-section"><h3>☷ Party Needs</h3><div class="check-grid"><label class="check"><input type="checkbox" name="catering" checked>Catering</label><label class="check"><input type="checkbox" name="decoration" checked>Decoration</label><label class="check"><input type="checkbox" name="entertainment" checked>Entertainment</label></div><label>Additional requirements<textarea name="additional_requirements" placeholder="Themes, dietary restrictions, special requests..."></textarea></label></div><button class="btn full" type="submit">▣ Generate Budget Plan</button><div id="partyMsg" class="form-msg"></div></form></section><section id="result" class="result"></section>{% endblock %}
