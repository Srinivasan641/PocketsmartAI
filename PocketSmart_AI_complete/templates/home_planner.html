{% extends 'base.html' %}{% block title %}Home Budget Planner | PocketSmart{% endblock %}{% block content %}<section class="planner-hero"><h1>Home Interior Budget Planner</h1><p>Plan your space with AI-powered budget recommendations.</p></section><section class="form-card"><form id="homeForm"><div class="form-section"><h3>💰 Basic Information</h3><div class="grid2"><label>Total Budget (₹)<input name="total_budget" type="number" min="1" step="0.01" required></label><label>Room Type / Details<input name="room_details" placeholder="Living room, bedroom, kitchen..." required></label></div></div><div class="form-section"><h3>💡 Room Requirements</h3><div class="grid2"><label>Lighting quantity<input name="lighting_requirements" type="number" min="0" value="1"></label><label>Ceiling fan quantity<input name="ceiling_fan_requirements" type="number" min="0" value="1"></label><label>Furniture requirements<textarea name="furniture_requirements" placeholder="Sofa, chairs, table..."></textarea></label><label>Table quantity<input name="table_quantity" type="number" min="0" value="0"></label></div><label>Style / Preferences<textarea name="preferences" placeholder="Modern, minimal, warm colors..."></textarea></label><label>Additional requirements<textarea name="additional_requirements"></textarea></label></div><button class="btn full" type="submit">▣ Generate Recommendations</button><div id="homeMsg" class="form-msg"></div></form></section><section id="result" class="result"></section>{% endblock %}
